<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found - Finance Toolkit</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d4ed8'/%3E%3Cpath d='M7 22l6-7 4 4 8-10' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    /* Self-contained: this page can be served from any depth, so it uses no relative assets. */
    :root { --bg:#f4f6fb; --fg:#0f172a; --muted:#475569; --card:#fff; --line:#cbd5e1; --accent:#1d4ed8; --on:#fff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0b1020; --fg:#e6eaf5; --muted:#a3aec6; --card:#131a2e; --line:#2a3555; --accent:#6ea8fe; --on:#0b1020; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:1rem; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    main { max-width:28rem; width:100%; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:2rem 1.5rem; text-align:center; }
    .code { font-size:4rem; font-weight:800; line-height:1; color:var(--accent); margin:0; }
    h1 { font-size:1.5rem; margin:.5rem 0; }
    p { color:var(--muted); margin:0 0 1.5rem; }
    a { display:inline-block; background:var(--accent); color:var(--on); text-decoration:none; font-weight:600; padding:.75rem 1.25rem; border-radius:10px; min-height:44px; }
    a:focus-visible { outline:3px solid var(--fg); outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>This page could not be found</h1>
    <p>The link may be mistyped or out of date. The calculators are one click away.</p>
    <a id="home" href="./">Back to the calculators</a>
  </main>
  <script>
    (function () {
      /* On project pages the site root is the first path segment (e.g. /Simple-interest-calculator/). */
      var seg = location.pathname.split('/').filter(Boolean)[0];
      var a = document.getElementById('home');
      if (/\.github\.io$/.test(location.hostname) && seg) a.setAttribute('href', '/' + seg + '/');
    })();
  </script>
</body>
</html>
